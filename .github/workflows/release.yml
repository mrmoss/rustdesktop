# Makes a draft GitHub release with downloadable programs when you push a tag like v0.6.25.
#
#   1. bump `version` in Cargo.toml (and CHANGELOG.md) and commit it
#   2. git tag v0.6.25 && git push --tags
#   3. wait for this workflow, look over the draft under "Releases", then publish it
#
# NOTE: written without being able to run it. If a runner image or action version has moved on,
# the fix is usually just bumping it here.
name: release

on:
  push:
    tags: ['v*']

# Read-only by default; only the last job, which creates the release, may write.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 24.04 so the programs run on 24.04 and everything newer (26.04).
          - { name: linux-x86_64,  runner: ubuntu-24.04 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the version in Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1; }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      - name: Package details
        run: echo "HOMEPAGE=https://github.com/$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
      - name: Build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev dpkg-dev
          ./build-layer-shell.sh
      - name: Release download (.tar.gz)
        run: just package
      - name: Debian package
        run: just deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  release:
    name: draft release
    permissions:
      contents: write
      id-token: write       # to sign the build provenance
      attestations: write
    needs: [build]
    # Still make the draft if one platform failed, so the other is not lost.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -l
          sha256sum * > SHA256SUMS
      # A signed statement, kept by GitHub, that these exact files were built by this workflow
      # from this repository (check one with `gh attestation verify FILE --repo OWNER/REPO`).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **This is AI-generated, lightly tested software. It's a hobby project: keep your usual desktop installed as well.**

          Downloads are for 64-bit Intel/AMD (`x86_64`, `amd64`) and ARM (`aarch64`, `arm64`), for Ubuntu 24.04 and 26.04.
          Check them against `SHA256SUMS`, or verify where they were built with `gh attestation verify FILE --repo OWNER/REPO`.

          - **Ubuntu (easiest):** `rusttouch_<version>_amd64.deb` (or `arm64`):
            `sudo apt install ./rusttouch_<version>_amd64.deb`, restart, and pick **RustTouch** on the login screen.
            If you installed RustTouch from source before, run `./uninstall.sh` from that folder first.
          - **Ubuntu, without the package manager:** `rusttouch-<version>-linux-<cpu>.tar.gz` has the programs already built.
            Unpack it, then in that folder run `./deps.sh` and `./install.sh` (no Rust needed).

          See the README for how to use it, and CHANGELOG.md for what changed.
          NOTES
          # Say so in the draft if a platform did not build.
          missing=""
          for pat in linux-x86_64 linux-aarch64 amd64.deb arm64.deb; do
            ls dist/*"$pat"* >/dev/null 2>&1 || missing="$missing $pat"
          done
          if [ -n "$missing" ]; then
            printf '\n> **Not built this time:**%s. See the workflow run.\n' "$missing" >> notes.md
            echo "::warning::missing downloads:$missing"
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A release for this tag already exists (for example made by hand on the website):
            # add the files to it instead of making a new one.
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              --generate-notes
          fi
