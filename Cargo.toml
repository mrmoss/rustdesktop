[package]
name = "rusttouch"
version = "0.6.7"
edition = "2021"
description = "A tiny Android-style touch shell for Wayland (layer-shell) with an X11/windowed fallback"
license = "GPL-2.0-only"

[dependencies]
# gtk4-layer-shell 0.5 is built against gtk4 0.9 - bump them together.
# (e.g. gtk4 0.10 + gtk4-layer-shell 0.6/0.7) if cargo complains about two gtk4 versions.
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }  # GTK 4.10+ (24.04 has 4.14)
gtk4-layer-shell = { version = "0.5", optional = true }
# window list (recents / switching / closing) via wlr-foreign-toplevel-management
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# input-method-v2: know when a text field is focused (auto-show keyboard)
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# reading `pactl -f json` (audio devices)
serde_json = "1"

[profile.release]
lto = "thin"

[features]
# "layer" = real shell surfaces on wlroots compositors (labwc/sway/phoc).
# Needs: sudo apt install libgtk4-layer-shell-dev
# Build without it (windowed phone-emulator only): cargo run --no-default-features
default = ["layer"]
layer = ["dep:gtk4-layer-shell"]
