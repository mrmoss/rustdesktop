[package]
name = "rustdesktop"
version = "0.9.19"
edition = "2021"
description = "RustDesktop: RustTouch, a tiny Android-style touch shell for Wayland, and RustTV, a home screen for a TV and remote"
repository = "https://github.com/mrmoss/rustdesktop"
license = "GPL-2.0-only"

# The programs keep their own names: rusttouch (here), rusttouch-settings
# (src/bin/rusttouch-settings.rs) and rusttv (src/bin/rusttv/).
[[bin]]
name = "rusttouch"
path = "src/main.rs"

[dependencies]
# gtk4-layer-shell 0.8 and gtk4-session-lock 0.4 are built against gtk4 0.11 - bump
# them together if cargo complains about two gtk4 versions.
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }  # GTK 4.10+ (24.04 has 4.14)
# gtk4 0.11 (gio 0.22) moved the Unix-only GIO types (DesktopAppInfo, ...) into their own crate.
# Keep this on the same minor version as the gio that gtk4 pulls in.
gio-unix = "0.22"
gtk4-layer-shell = { version = "0.8.1", optional = true }
# the lock screen: ext-session-lock-v1, from the same C library (gtk4-layer-shell 1.1+).
# 0.4.x is the release built for gtk4 0.11 - bump together with gtk4.
gtk4-session-lock = { version = "0.4.1", optional = true, features = ["v1_1"] }
# window list (recents / switching / closing) via wlr-foreign-toplevel-management
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# input-method-v2: know when a text field is focused (auto-show keyboard)
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# reading `pactl -f json` (audio devices)
serde_json = "1"

[profile.release]
lto = "thin"

[features]
# "layer" = real shell surfaces on wlroots compositors (labwc/sway/phoc).
# Needs: sudo apt install libgtk4-layer-shell-dev
# Build without it (windowed phone-emulator only): cargo run --no-default-features
default = ["layer"]
layer = ["dep:gtk4-layer-shell", "dep:gtk4-session-lock"]
