# cargo deny check advisories bans sources  (run by .github/workflows/audit.yml)

[advisories]
# known vulnerabilities always fail; crates that are only unmaintained fail
# when we use them directly (cargo audit lists the rest as warnings)
unmaintained = "workspace"

[bans]
# gtk-rs pulls in a few crates twice in different versions; that's fine
multiple-versions = "allow"

[sources]
# every dependency must come from crates.io
unknown-registry = "deny"
unknown-git = "deny"
