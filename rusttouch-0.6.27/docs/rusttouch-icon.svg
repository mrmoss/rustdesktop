<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2463b"/>
      <stop offset="1" stop-color="#8a2be2"/>
    </linearGradient>
  </defs>
  <!-- background tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <!-- the tablet -->
  <rect x="30" y="20" width="68" height="88" rx="12" fill="none" stroke="#fff" stroke-width="6"/>
  <!-- app icons on the home screen -->
  <g fill="#fff" opacity="0.9">
    <rect x="42" y="34" width="14" height="14" rx="4"/>
    <rect x="72" y="34" width="14" height="14" rx="4"/>
    <rect x="42" y="58" width="14" height="14" rx="4"/>
    <rect x="72" y="58" width="14" height="14" rx="4"/>
  </g>
  <!-- the back, home and recents buttons -->
  <g fill="#fff">
    <path d="M48 87 l9 -6 v12 z"/>
    <circle cx="64" cy="87" r="5"/>
    <rect x="73" y="82" width="10" height="10" rx="1.5"/>
  </g>
</svg>
