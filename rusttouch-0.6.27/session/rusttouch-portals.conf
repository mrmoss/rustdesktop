# Installed to /etc/xdg/xdg-desktop-portal/rusttouch-portals.conf
# Which desktop portal backends answer for the rusttouch session (matched from
# XDG_CURRENT_DESKTOP=rusttouch). The GNOME backend needs gnome-shell, so it
# would hang; the GTK one works anywhere.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
